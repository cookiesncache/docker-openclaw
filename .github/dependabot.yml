version: 2
updates:
  # The four actions in build.yml / ci.yml run with a GHCR push credential in scope, so
  # they are pinned to commit SHAs. Dependabot is what keeps those pins from rotting.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Deliberate, not a restatement of a default: Dependabot has NO default cooldown - omit the
    # block and updates arrive immediately. Cooldown applies to version updates only; security
    # updates are exempt by design, which is what makes auto-merging them safe.
    #
    # Three days, and no more, because SHA pinning is the real defence here and cooldown is only
    # backup. The tj-actions/changed-files compromise (CVE-2025-30066) ran ~15 hours before
    # detection and ~23 to a safe version - but it worked by retroactively repointing existing
    # version tags: no new version, no PR, and therefore no cooldown involved at all.
    cooldown:
      default-days: 3

  # The LSIO base image digest pin in the Dockerfile. Note that Docker is not a GitHub
  # Advisory Database ecosystem, so these arrive as routine version updates with no
  # security metadata attached - never as security updates.
  #
  # Dependabot does not apply the cooldown below to GHCR images: every docker run logs "No
  # verified registry publication date source for ghcr.io; skipping cooldown". The delay these
  # PRs actually get is the soak in release-soaked (workflows/dependabot-auto-merge.yml), whose
  # ceiling assumes this weekly interval.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Three days is a measured ceiling, not a copy of the value above.
    #
    # Cooldown measures the age of the tag's CURRENT digest, so it must sit BELOW the upstream
    # rebuild interval. Above it, the digest is never old enough to clear the window, no PR ever
    # opens, and the pin silently freezes while forced rebuilds keep baking a stale base -
    # userland gets older, not fresher.
    #
    # Measured 2026-10-17 from linuxserver/docker-baseimage-ubuntu resolute releases ls1..ls29
    # (2026-04-05 to 2026-10-14, 28 intervals): median 7.0 days, minimum 0.8 (a same-commit
    # rebuild, ls10 -> ls11), maximum 14.0. Only four intervals are under 6 days: that rebuild,
    # two in the April launch weeks (3.7, 3.3) and one off-cycle release (ls14 -> ls15, 3.4). So
    # 14 would never open a PR and even 7 races the weekly cycle; 3 sits under every regular
    # interval. (noble measured the same shape in 2026-08: modal 7.0, minimum 3.4.) Re-measure
    # before raising this.
    #
    # Two things Dependabot's own logs show, as of 2026-10-17:
    #   - This cooldown is currently INERT. Every docker run logs "No verified registry
    #     publication date source for ghcr.io; skipping cooldown", and each PR carries a
    #     "Cooldown could not be applied" banner. Kept so it applies if GHCR support lands.
    #   - Docker PRs are keyed by TAG, not digest: "Pull request #29 already exists for
    #     linuxserver/baseimage-ubuntu with latest version noble". One open PR therefore blocks
    #     every later digest for that tag, so a red base-bump PR freezes the base outright. Fix
    #     or close a red one promptly; `@dependabot rebase` re-runs its CI against current main.
    cooldown:
      default-days: 3
