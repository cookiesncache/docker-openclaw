name: build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'root/**'
      - '.dockerignore'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      # Two separate switches on purpose. They answer different questions, and a dispatch that
      # implied both would mean re-running the workflow merely to read its logs republishes
      # byte-shuffled content as a phantom update to every install AND adopts a possibly
      # hours-old upstream release.
      force:
        description: 'Rebuild and push even if no build input changed'
        type: boolean
        default: false
      adopt:
        description: 'Adopt the current upstream :latest even if it is younger than the cooldown'
        type: boolean
        default: false
  schedule:
    # Daily check, not weekly. The gate below makes an unchanged day nearly free (two
    # registry reads, then exit), and daily closes two latency gaps that weekly cannot:
    #   - a merge performed with GITHUB_TOKEN does not trigger another workflow run, so a
    #     Dependabot base-image bump merged by dependabot-auto-merge.yml would otherwise
    #     sit unpublished until the next Monday;
    #   - upstream openclaw releases are picked up within a day instead of within a week.
    # The LSIO base is pinned by digest in the Dockerfile, so base movement arrives as a
    # Dependabot PR rather than being resolved here.
    - cron: '0 6 * * *'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openclaw
  UPSTREAM: ghcr.io/openclaw/openclaw:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Two decisions, made together in .github/scripts/gate.sh:
      #
      #   1. WHICH upstream digest to build against. A release pushed minutes ago is not
      #      adopted; the previously published digest keeps shipping until the candidate is
      #      past a short cooldown. Overridden by a published security advisory that affects
      #      the version we ship, or by a manual `adopt` dispatch.
      #   2. WHETHER to publish at all, by comparing a fingerprint of the build inputs against
      #      the one annotated on the published index - one registry read, no external state,
      #      and no way to drift from what actually shipped.
      #
      # The repo side of the fingerprint hashes the *content* of the build inputs (Dockerfile,
      # root/, .dockerignore, and this workflow) rather than $GITHUB_SHA. A docs-only commit
      # moves HEAD without changing what goes into the image; using HEAD would make the next
      # scheduled run republish an image differing only in BUILD_DATE, which every Unraid
      # install would see as a phantom update.
      #
      # gate.sh is deliberately NOT in that input set: it chooses which image to build, it is
      # not in the image. Keeping it out means iterating on gate logic does not publish to
      # every install just to test a decision.
      # ---------------------------------------------------------------------
      - name: Decide what to build and whether to publish
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          IN_FORCE: ${{ inputs.force }}
          IN_ADOPT: ${{ inputs.adopt }}
          # Rate-limit courtesy for the advisory lookup; it also works unauthenticated, and the
          # script falls back to that. No extra permission scope is required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/gate.sh

      - name: Metadata + upstream version
        id: meta
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Probe the digest the image is actually built from, never the floating tag:
          # resolving the tag a second time would let the published version label describe
          # a different artifact than the one that shipped.
          PINNED="ghcr.io/openclaw/openclaw@${{ steps.gate.outputs.upstream }}"
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          docker pull -q "$PINNED"

          # Upstream ships distinct builds of one release as 2026.7.1, 2026.7.1-1,
          # 2026.7.1-2 - three different digests. The OCI label is the ONLY probe that
          # carries that build suffix; `openclaw --version` and package.json both report
          # the bare version. Probe the label first so two upstream builds of the same
          # release cannot collapse onto one tag here.
          RE='[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9]+)?'
          VER=$(docker inspect "$PINNED" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' 2>/dev/null                 | grep -oiE "$RE" | head -1 || true)
          if [ -z "$VER" ]; then
            VER=$(timeout 30 docker run --rm --entrypoint node "$PINNED" /app/openclaw.mjs --version 2>/dev/null                   | grep -oiE "$RE" | head -1 || true)
          fi
          if [ -z "$VER" ]; then
            # Match the "version" key specifically, not the first calver-looking string
            # anywhere in the file (a calver-versioned dependency could precede it).
            VER=$(docker run --rm --entrypoint cat "$PINNED" /app/package.json 2>/dev/null                   | grep -oE '"version"[[:space:]]*:[[:space:]]*"'"$RE"'"' | head -1                   | grep -oE "$RE" | head -1 || true)
          fi
          echo "version=${VER}"           >> "$GITHUB_OUTPUT"   # full, e.g. 2026.7.1-1
          echo "version_base=${VER%%-*}"  >> "$GITHUB_OUTPUT"   # bare, e.g. 2026.7.1
          echo "Upstream OpenClaw version: ${VER:-unknown} (base ${VER%%-*})"

      - name: Compute tags
        id: tags
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          UPSTREAM_REF="ghcr.io/openclaw/openclaw@${{ steps.gate.outputs.upstream }}"
          case "$UPSTREAM_REF" in
            *@sha256:*) ;;
            *) echo "::error::refusing to publish an unpinned upstream reference: $UPSTREAM_REF"; exit 1 ;;
          esac
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"

          VER='${{ steps.meta.outputs.version }}'
          VER_BASE='${{ steps.meta.outputs.version_base }}'
          SHA='${{ steps.meta.outputs.sha }}'

          # Immutable, never re-pushed: LinuxServer's convention for "same upstream
          # version, several image builds" (compare linuxserver/code-server:4.133.0-ls358).
          # This is the tag users pin. run_number is monotonic per workflow; gaps are
          # expected because runs that publish nothing still consume a number.
          BUILD_TAG="${VER:-$SHA}-ls${{ github.run_number }}"

          # Floating by design: :latest and the bare version always point at the newest
          # build. Deliberately NOT tagging by repo commit - the dominant publish trigger
          # is upstream moving with HEAD unchanged, so a commit tag would be re-pushed
          # over different content and read as a pin while behaving like :latest.
          TAGS="${IMAGE}:latest"
          if [ -n "$VER_BASE" ]; then
            TAGS="${TAGS},${IMAGE}:${VER_BASE}"
          fi
          TAGS="${TAGS},${IMAGE}:${BUILD_TAG}"

          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}"           >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      # Smoke-test BEFORE publishing. This is the only gate on the scheduled path, which is
      # where upstream drift arrives - a new Node major, a changed /usr/local layout, or a
      # native-module ABI break would otherwise ship straight to :latest.
      #
      # Deliberately a plain `docker buildx build`, not the build-push-action: the docker
      # exporter cannot carry attestations, and keeping the test build out of the action
      # means there is exactly one build-push-action invocation and its provenance setting
      # is never in question. The layers are shared via the gha cache, so this is cheap.
      - name: Build for smoke test (local only, never pushed)
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          docker buildx build --load -t openclaw:smoke \
            --build-arg UPSTREAM_REF='${{ steps.tags.outputs.upstream_ref }}' \
            --build-arg APT_EPOCH='${{ steps.gate.outputs.apt_epoch }}' \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: Smoke test the built image
        if: steps.gate.outputs.publish == 'true'
        run: bash .github/scripts/smoke.sh openclaw:smoke

      - name: Build and push
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Unraid's update check (DockerClient.php) accepts the Docker v2
          # manifest/list types and the OCI *index* type, but never
          # application/vnd.oci.image.manifest.v1+json. `provenance: false` on a
          # single-platform build pushes exactly that bare OCI manifest, so GHCR
          # answers Unraid with 404 -> "not available" -> auto-update never fires.
          # Keeping provenance on wraps the image in an OCI index, which Unraid
          # reads (same shape upstream openclaw and the LSIO base images publish).
          provenance: mode=min
          annotations: |
            index:io.cookiesncache.inputs=${{ steps.gate.outputs.hash }}
            index:io.cookiesncache.openclaw.upstream.digest=${{ steps.gate.outputs.upstream }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          # APT_EPOCH must be the SAME value the smoke build above used - both read the gate
          # step's single computed output. Never compute the date here: two `date` calls either
          # side of midnight UTC would smoke-test one image and push a different one. (Comments
          # cannot live inside the build-args block below: the action parses every line there as
          # a literal KEY=VALUE.)
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VERSION=${{ steps.tags.outputs.build_tag }}
            UPSTREAM_REF=${{ steps.tags.outputs.upstream_ref }}
            APT_EPOCH=${{ steps.gate.outputs.apt_epoch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------------
      # The image that was smoke-tested must be the image that got pushed.
      #
      # The two builds are separate invocations that share layers only through the gha cache, so
      # nothing structurally guarantees they produce identical filesystems: a cache miss, or a
      # build-arg passed to one and not the other, would silently publish layers that were never
      # booted. APT_EPOCH makes that hazard real rather than theoretical, because it sits ABOVE
      # the apt layer - unlike BUILD_DATE and VERSION, a mismatch changes actual content.
      #
      # Compared as rootfs diff_ids (uncompressed), which both sides expose: the local image via
      # docker inspect, the pushed one via its config blob. LABEL-only differences create no
      # layers, so the BUILD_DATE/VERSION asymmetry between the two builds does not show up here.
      # ---------------------------------------------------------------------
      - name: Verify the pushed image is the one that was smoke-tested
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_PATH="${OWNER}/openclaw"
          ACCEPT='application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json'
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull&service=ghcr.io" | jq -r .token)

          IDX=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
                  "https://ghcr.io/v2/${REPO_PATH}/manifests/${{ steps.tags.outputs.build_tag }}")
          MAN_DIGEST=$(printf '%s' "$IDX" | jq -r '.manifests[]? | select(.platform.architecture=="amd64") | .digest')
          if [ -n "$MAN_DIGEST" ]; then
            MAN=$(curl -fsSL -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" \
                    "https://ghcr.io/v2/${REPO_PATH}/manifests/${MAN_DIGEST}")
          else
            MAN="$IDX"
          fi
          CFG_DIGEST=$(printf '%s' "$MAN" | jq -r '.config.digest')
          PUSHED=$(curl -fsSL -H "Authorization: Bearer $TOKEN" \
                     "https://ghcr.io/v2/${REPO_PATH}/blobs/${CFG_DIGEST}" | jq -c '.rootfs.diff_ids')
          SMOKED=$(docker inspect openclaw:smoke --format '{{json .RootFS.Layers}}' | jq -c '.')

          if [ "$PUSHED" = "$SMOKED" ]; then
            echo "::notice::pushed image is layer-identical to the smoke-tested image"
          else
            echo "::error::the pushed image is NOT the image that was smoke-tested"
            echo "  smoked: $SMOKED"
            echo "  pushed: $PUSHED"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # The published manifest must stay readable by Unraid's update check.
      #
      # DockerClient.php sends the exact Accept header below. It does NOT include
      # application/vnd.oci.image.manifest.v1+json, so if a push ever produces a bare
      # OCI image manifest instead of an index, GHCR answers 404,
      # unraid-update-status.json records "remote": null, the UI column reads "not
      # available", and CA Auto Update silently stops firing for every install. That
      # has already happened here once (provenance: false on a single-platform build);
      # the legacy :52dca30 tag still 404s under this header today.
      #
      # pr-smoke cannot catch this - it builds with --load and never pushes, so it
      # never sees what the registry serves. This is the only check that does.
      # ---------------------------------------------------------------------
      - name: Verify the published manifest is readable by Unraid
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_PATH="${OWNER}/openclaw"
          ACCEPT='application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json'
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${REPO_PATH}:pull&service=ghcr.io" | jq -r .token)

          fail=0
          for tag in latest '${{ steps.tags.outputs.build_tag }}'; do
            [ -n "$tag" ] || continue
            URL="https://ghcr.io/v2/${REPO_PATH}/manifests/${tag}"
            result=""
            for attempt in 1 2 3; do
              # -w avoids parsing headers (and their CRLFs) altogether.
              result=$(curl -so /dev/null -w '%{http_code} %{content_type}' -H "Authorization: Bearer $TOKEN" -H "Accept: $ACCEPT" "$URL")
              case "$result" in 200*) break ;; esac
              sleep 5
            done
            code=${result%% *}
            ctype=${result#* }
            echo "  :${tag} -> HTTP ${code} ${ctype}"

            if [ "$code" != "200" ]; then
              echo "::error::GHCR returned ${code} for :${tag} under Unraid's Accept header - update checks would break for every install"
              fail=1
              continue
            fi
            case "$ctype" in
              *oci.image.index.v1+json*|*manifest.list.v2+json*|*distribution.manifest.v2+json*) ;;
              *)
                echo "::error::tag ${tag} is ${ctype}, a type Unraid's Accept header does not include - update checks would break"
                fail=1
                ;;
            esac
          done
          [ "$fail" = 0 ] || exit 1
          echo "::notice::published manifests are readable with Unraid's Accept header"
