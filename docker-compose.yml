---
services:
  openclaw:
    build: .
    image: openclaw:lsio
    container_name: openclaw
    environment:
      # Unraid: PUID=99 / PGID=100 (nobody:users) so it matches appdata ownership.
      # Standard Linux host: PUID=1000 / PGID=1000.
      - PUID=99
      - PGID=100
      - UMASK=022
      - TZ=America/New_York
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Leave false. Set true only if you reach the dashboard over plain HTTP with no TLS in
      # front - without it, pairing will fail on a plain-HTTP LAN address.
      - OPENCLAW_ALLOW_INSECURE_AUTH=false
      # Advanced. Inbound bind mode. Unset -> loopback when Tailscale Serve is enabled, else lan.
      # Set to lan if something must reach IN (reverse proxy, dashboard widget, another
      # container using the OpenAI-compatible endpoints), or if you enable Tailscale but keep
      # a published 18789 port. Outbound is unaffected.
      - OPENCLAW_GATEWAY_BIND=${OPENCLAW_GATEWAY_BIND:-}
      # Control UI allowed origins (CSRF protection). Set to the URL you reach the UI from,
      # e.g. https://openclaw.YOUR-TAILNET.ts.net  (comma-separated for multiple).
      - OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS=${OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS:-}
      # Optional extra provider keys / bot tokens (set in .env if used):
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - COPILOT_GITHUB_TOKEN=${COPILOT_GITHUB_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - BRAVE_API_KEY=${BRAVE_API_KEY:-}
    volumes:
      - ./config:/config
    ports:
      - 18789:18789
    restart: unless-stopped
